name: Build data catalog

on:
  push:
    branches:
      - agent/reorganize-data-assets-metadata
    paths-ignore:
      - data/metadata/datasets.csv

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reorganize-data-assets-metadata
          fetch-depth: 0

      - name: Generate metadata catalog
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from urllib.parse import quote

          raw_dir = Path('data/raw')
          output = Path('data/metadata/datasets.csv')

          sql_map = {
              'History-Sum-By-Month-Per-Year-of-Votes-by-Tag.csv': 'History-Sum-By-Month-Per-Year-of-Votes-by-Tag.txt',
              'all-db-names-from-db-system.csv': 'all-db-names-from-db-system.txt',
              'cumulative-answers-questions-stackexchange.csv': 'cumulative-answers-questions-stackexchange.sql',
              'cumulative-unanswered-questions-per-month-since-2008.csv': 'cumulative-unanswered-questions-per-month.txt',
              'new-answers-per-day-since-2008.csv': 'new-answers-per-day-since-2008.txt',
              'new-answers-per-month-since-2008.csv': 'new-answers-per-month-since-2008.txt',
              'new-question-activity-per-day-since-2008.csv': 'new-question-activity-per-day-since-2008.txt',
              'new-question-activity-per-month-since-2008.csv': 'new-question-activity-per-month-since-2008.txt',
              'new-questions-per-day-by-sites-since-2008.csv': 'new-questions-per-day-by-sites-since-2008.txt',
              'tags-db.csv': 'tags-db.txt',
              'user-metrics-by-site-by-month-all-time.csv': 'user-metrics-by-site-by-month-all-time.txt',
              'user-static-metrics-by-several-site-all-time.csv': 'user-static-metrics-by-several-site-all-time.txt',
          }

          table_description = {
              'History-Sum-By-Month-Per-Year-of-Votes-by-Tag.csv': 'Monthly vote metrics by tag.',
              'all-db-names-from-db-system.csv': 'SEDE Stack Overflow/Stack Exchange database names.',
              'cumulative-answers-questions-stackexchange.csv': 'Monthly question-lifecycle series matching the legacy workbook.',
              'cumulative-unanswered-questions-per-month-since-2008.csv': 'Monthly unanswered/no-answer question stocks and flows.',
              'new-answers-per-day-since-2008.csv': 'Daily new-answer counts by deletion status.',
              'new-answers-per-month-since-2008.csv': 'Monthly new-answer counts by deletion status.',
              'new-question-activity-per-day-since-2008.csv': 'Daily new-question counts.',
              'new-question-activity-per-month-since-2008.csv': 'Monthly new-question counts.',
              'new-questions-per-day-by-sites-since-2008.csv': 'Daily new-question counts across selected Stack Exchange sites.',
              'tags-db.csv': 'Snapshot of the SEDE Tags table.',
              'user-metrics-by-site-by-month-all-time.csv': 'User metrics by site and account-creation month.',
              'user-static-metrics-by-several-site-all-time.csv': 'Cross-site snapshot of aggregate user metrics.',
          }

          exact_description = {
              'RowNumber': 'Ordinal row number produced by the query ordering.',
              'TagName': 'Stack Exchange tag name.',
              'VoteMonth': 'First day of the vote month.',
              'Upvotes': 'Count of upvotes for tagged posts in the month.',
              'Downvotes': 'Count of downvotes for tagged posts in the month.',
              'TotalVotes': 'Upvotes plus downvotes.',
              'NetVotes': 'Upvotes minus downvotes.',
              'UpvoteDownvoteRatio': 'Ratio of upvotes to downvotes; null when downvotes are zero.',
              'DatabaseName': 'Name of a Stack Overflow or Stack Exchange database exposed by SEDE.',
              'MonthStart': 'First day of the reference month.',
              'Month Year': 'Duplicate reference-month field retained for the legacy workbook time axis.',
              'CumulativeUnansweredQuestions': 'Running stock of questions with neither an accepted answer nor a currently positive-scored answer.',
              'Cumulative Unanswered Questions': 'Running stock of questions with neither an accepted answer nor a currently positive-scored answer.',
              'CumulativeNoAnswersAtAll': 'Running stock of questions that have never received an answer.',
              'Cumulative No Answers At All': 'Running stock of questions that have never received an answer.',
              'NewQuestions': 'Count of questions created in the reference period.',
              'New Questions': 'Count of questions created in the reference month.',
              'NewlyAnsweredQuestions': 'Questions leaving the unanswered state in the reference month.',
              'Newly Answered Questions': 'Questions leaving the unanswered state in the reference month.',
              'NewlyGotFirstAnswer': 'Questions receiving their first answer in the reference month.',
              'NetChangeInUnanswered': 'New questions minus questions leaving the unanswered state.',
              'NetChangeInNoAnswersAtAll': 'New questions minus questions receiving their first answer.',
              'Date': 'Reference day or first day of the reference month, according to the query grain.',
              'Day': 'Calendar day of question creation.',
              'Status': 'Current deletion status: deleted or non-deleted.',
              'NewAnswers': 'Count of newly created answers for the reference period and status.',
              'Id': 'Tag identifier in the Stack Exchange data model.',
              'Count': 'Current number of posts associated with the tag.',
              'ExcerptPostId': 'Tag-excerpt post identifier when available.',
              'WikiPostId': 'Tag-wiki post identifier when available.',
              'IsModeratorOnly': 'Whether the tag is restricted to moderator use.',
              'IsRequired': 'Whether the tag is required.',
              'Site': 'SEDE site/database represented by the row.',
              'CreationMonth': 'First day of the user account-creation month.',
              'UsersCount': 'Number of users represented by the row.',
              'DistinctNetworkAccounts': 'Number of distinct Stack Exchange network AccountId values.',
              'UpvoteDownvoteRatio': 'Ratio of total upvotes cast to total downvotes cast; null when downvotes are zero.',
          }

          site_labels = {
              'AiQuestions': 'AI', 'AstronomyQuestions': 'Astronomy',
              'ComputerGraphicsQuestions': 'Computer Graphics',
              'ComputerScienceQuestions': 'Computer Science',
              'CsEducatorsQuestions': 'Computer Science Educators',
              'CsTheoryQuestions': 'Theoretical Computer Science',
              'DataScienceQuestions': 'Data Science', 'EarthScienceQuestions': 'Earth Science',
              'EngineeringQuestions': 'Engineering', 'GenAIQuestions': 'Generative AI',
              'MathematicsQuestions': 'Mathematics', 'MathEducatorsQuestions': 'Mathematics Educators',
              'MathOverflowQuestions': 'MathOverflow', 'PhysicsQuestions': 'Physics',
              'QuantQuestions': 'Quantitative Finance', 'QuantumComputingQuestions': 'Quantum Computing',
              'RoboticsQuestions': 'Robotics', 'ScientificComputingQuestions': 'Computational Science',
              'StatisticsQuestions': 'Cross Validated / Statistics', 'TeXQuestions': 'TeX / LaTeX',
              'StackOverflowQuestions': 'Stack Overflow',
          }

          metric_labels = {
              'Reputation': 'reputation', 'ProfileViews': 'profile views',
              'UpVotesCast': 'upvotes cast', 'DownVotesCast': 'downvotes cast',
              'VotesCast': 'total votes cast', 'NetVotesCast': 'net votes cast',
              'AccountAgeDays': 'account age in days',
              'DaysSinceLastAccess': 'days since last access',
          }
          prefix_labels = {'Total': 'Total', 'Avg': 'Mean', 'Min': 'Minimum', 'Max': 'Maximum', 'Std': 'Standard deviation of'}
          profile_labels = {'Website': 'WebsiteUrl', 'AboutMe': 'AboutMe', 'ProfileImage': 'ProfileImageUrl', 'NetworkAccount': 'network AccountId'}

          def column_type(name):
              if name in {'MonthStart', 'Month Year', 'Date', 'Day', 'VoteMonth', 'CreationMonth'}:
                  return 'date'
              if name in {'TagName', 'DatabaseName', 'Status', 'Site'}:
                  return 'string'
              if name in {'IsModeratorOnly', 'IsRequired'}:
                  return 'boolean'
              if name.startswith(('Avg', 'Std')) or name.endswith('Ratio'):
                  return 'float'
              return 'integer'

          def describe(name):
              if name in exact_description:
                  return exact_description[name]
              if name in site_labels:
                  return f"Count of new questions on {site_labels[name]} that day."
              for prefix, label in prefix_labels.items():
                  if name.startswith(prefix):
                      metric = name[len(prefix):]
                      if metric in metric_labels:
                          return f"{label} {metric_labels[metric]}."
              for state in ('With', 'Without'):
                  marker = f'Users{state}'
                  if name.startswith(marker):
                      feature = name[len(marker):]
                      if feature in profile_labels:
                          condition = 'with' if state == 'With' else 'without'
                          return f"Count of users {condition} {profile_labels[feature]}."
              return 'Field returned by the paired SEDE query.'

          csv_files = sorted(p.name for p in raw_dir.glob('*.csv'))
          expected = set(sql_map)
          actual = set(csv_files)
          if actual != expected:
              raise SystemExit(f'Raw CSV/query mapping mismatch. Missing mapping: {sorted(actual-expected)}; missing CSV: {sorted(expected-actual)}')

          rows = []
          for filename in csv_files:
              path = raw_dir / filename
              with path.open('r', encoding='utf-8-sig', errors='replace', newline='') as handle:
                  header = next(csv.reader(handle))
              url = 'https://github.com/ozsp12/project_stack_analysis/blob/main/data/raw/' + quote(filename)
              for column in header:
                  column = column.strip()
                  rows.append([
                      filename,
                      column,
                      column_type(column),
                      describe(column),
                      sql_map[filename],
                      table_description[filename],
                      url,
                  ])

          output.parent.mkdir(parents=True, exist_ok=True)
          with output.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  'nome da tabela', 'nome da coluna', 'tipo da coluna',
                  'descrição da coluna', 'nome do SQL que gera o csv',
                  'descrição da tabela', 'URL do csv'
              ])
              writer.writerows(rows)

          print(f'Wrote {output} with {len(rows)} rows for {len(csv_files)} datasets.')
          PY

      - name: Commit generated catalog
        run: |
          if git diff --quiet -- data/metadata/datasets.csv && git ls-files --error-unmatch data/metadata/datasets.csv >/dev/null 2>&1; then
            echo "Catalog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metadata/datasets.csv
          git commit -m "Generate data metadata catalog"
          git push origin HEAD:agent/reorganize-data-assets-metadata
